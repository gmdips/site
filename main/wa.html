<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirecting to the GDIPS WhatsApp group</title>
  <meta name="description" content="You are being redirected to the GDIPS community WhatsApp group.">
  <meta name="theme-color" content="#FFF7F6">
  <meta http-equiv="refresh" content="3; url=https://chat.whatsapp.com/Fmh5DoSjbWkBje0ab3RAEF?mode=ac_t">
  <link rel="icon" href="assets/brand/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="assets/brand/favicon-32.png" type="image/png" sizes="32x32">
  <link rel="apple-touch-icon" href="assets/brand/apple-touch-icon.png">
  <link rel="manifest" href="manifest.json">

  <link rel="stylesheet" href="assets/vendor/fontawesome/css/all.min.css">

  <!-- Material You 3 design system -->
  <link rel="stylesheet" href="assets/m3/palettes.css">
  <link rel="stylesheet" href="assets/m3/tokens.css">
  <link rel="stylesheet" href="assets/m3/components.css">
  <link rel="stylesheet" href="assets/m3/site.css">
  <link rel="stylesheet" href="assets/m3/pages.css">
  <script src="assets/m3/color.js"></script>
  <script src="assets/m3/ui.js" defer></script>
</head>

<body class="m3-page">
  <main class="gd-redirect" id="main">
    <div class="gd-redirect__card m3-animate-in">
      <span class="m3-badge m3-badge--primary"><i class="fab fa-whatsapp" aria-hidden="true"></i> Community</span>
      <img class="gd-redirect__logo" src="assets/brand/gdips-mark.svg" alt="GDIPS logo">
      <h1 class="m3-headline-small">GDIPS WhatsApp group</h1>
      <p class="m3-body-medium m3-text-muted">Redirecting you to our community group…</p>

      <p class="gd-redirect__count" id="countdown" aria-live="polite">3</p>

      <div class="m3-progress-linear gd-redirect__ring" aria-hidden="true">
        <div class="m3-progress-linear__bar" id="countdownBar" style="width:0%"></div>
      </div>

      <a class="m3-button m3-button--lg m3-button--full" href="https://chat.whatsapp.com/Fmh5DoSjbWkBje0ab3RAEF?mode=ac_t">
        <i class="fab fa-whatsapp" aria-hidden="true"></i><span>Open the group now</span>
      </a>
      <p class="m3-body-small m3-text-muted">Click the button if you are not redirected automatically.</p>
    </div>
  </main>

  <script>
    /* Countdown behaviour preserved (3 → 0), plus a progress ring */
    let count = 3;
    const countdown = document.getElementById('countdown');
    const bar = document.getElementById('countdownBar');
    const timer = setInterval(() => {
      count--;
      countdown.textContent = count;
      bar.style.width = ((3 - Math.max(count, 0)) / 3 * 100) + '%';
      if (count <= 0) {
        clearInterval(timer);
      }
    }, 1000);
  </script>
</body>
</html>
